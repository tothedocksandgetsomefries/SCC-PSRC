name: CPU reference smoke
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install ".[test,training]"
      - run: python scripts/verify_release_files.py
      - run: python -m fvsr.cli demo
      - run: python -m pytest tests/unit tests/parity -q -p no:cacheprovider
